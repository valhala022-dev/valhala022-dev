<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Animated Kali Linux logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.6" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#367bf0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#06283a"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <path id="kali" d="M12.778 5.943s-1.97-.13-5.327.92c-3.42 1.07-5.36 2.587-5.36 2.587s5.098-2.847 10.852-3.008zm7.351 3.095l.257-.017s-1.468-1.78-4.278-2.648c1.58.642 2.954 1.493 4.021 2.665zm.42.74c.039-.068.166.217.263.337.004.024.01.039-.045.027-.005-.025-.013-.032-.013-.032s-.135-.08-.177-.137c-.041-.057-.049-.157-.028-.195zm3.448 8.479s.312-3.578-5.31-4.403a18.277 18.277 0 0 0-2.524-.187c-4.506.06-4.67-5.197-1.275-5.462 1.407-.116 3.087.643 4.73 1.408-.007.204.002.385.136.552.134.168.648.35.813.445.164.094.691.43 1.014.85.07-.131.654-.512.654-.512s-.14.003-.465-.119c-.326-.122-.713-.49-.722-.511-.01-.022-.015-.055.06-.07.059-.049-.072-.207-.13-.265-.058-.058-.445-.716-.454-.73-.009-.016-.012-.031-.04-.05-.085-.027-.46.04-.46.04s-.575-.283-.774-.893c.003.107-.099.224 0 .469-.3-.127-.558-.344-.762-.88-.12.305 0 .499 0 .499s-.707-.198-.82-.85c-.124.293 0 .469 0 .469s-1.153-.602-3.069-.61c-1.283-.118-1.55-2.374-1.43-2.754 0 0-1.85-.975-5.493-1.406-3.642-.43-6.628-.065-6.628-.065s6.45-.31 11.617 1.783c.176.785.704 2.094.989 2.723-.815.563-1.733 1.092-1.876 2.97-.143 1.878 1.472 3.53 3.474 3.58 1.9.102 3.214.116 4.806.942 1.52.84 2.766 3.4 2.89 5.703.132-1.709-.509-5.383-3.5-6.498 4.181.732 4.549 3.832 4.549 3.832zM12.68 5.663l-.15-.485s-2.484-.441-5.822-.204C3.37 5.211 0 6.38 0 6.38s6.896-1.735 12.68-.717Z"/>
    <clipPath id="logoClip"><use href="#kali" transform="translate(310 50) scale(7.5)"/></clipPath>
    <clipPath id="typeClip"><rect x="190" y="300" width="0" height="26">
      <animate attributeName="width" values="0;420;420;0" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="frame"><rect width="800" height="340" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="340" fill="url(#bg)"/>
    <rect width="800" height="340" fill="url(#grid)"/>

    <!-- falling hex columns -->
    <g font-family="Fira Code, Consolas, monospace" font-size="12" fill="#00f0ff" fill-opacity="0.35">
      <text x="30" y="-10">0x4B41<animate attributeName="y" from="-20" to="360" dur="6s" repeatCount="indefinite"/></text>
      <text x="85" y="-10">0xC0DE<animate attributeName="y" from="-20" to="360" dur="8s" begin="-3s" repeatCount="indefinite"/></text>
      <text x="140" y="-10">01001011<animate attributeName="y" from="-20" to="360" dur="7s" begin="-5s" repeatCount="indefinite"/></text>
      <text x="215" y="-10">0xFF<animate attributeName="y" from="-20" to="360" dur="9s" begin="-1s" repeatCount="indefinite"/></text>
      <text x="585" y="-10">0xD3AD<animate attributeName="y" from="-20" to="360" dur="7.5s" begin="-2s" repeatCount="indefinite"/></text>
      <text x="640" y="-10">10110101<animate attributeName="y" from="-20" to="360" dur="6.5s" begin="-4s" repeatCount="indefinite"/></text>
      <text x="715" y="-10">0xB33F<animate attributeName="y" from="-20" to="360" dur="8.5s" begin="-6s" repeatCount="indefinite"/></text>
      <text x="760" y="-10">0x00<animate attributeName="y" from="-20" to="360" dur="5.5s" begin="-1.5s" repeatCount="indefinite"/></text>
    </g>

    <!-- rotating rings -->
    <g fill="none" stroke="#00f0ff" stroke-linecap="round">
      <circle cx="400" cy="140" r="128" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 14">
        <animateTransform attributeName="transform" type="rotate" from="0 400 140" to="360 400 140" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="400" cy="140" r="112" stroke="#ff00ff" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="60 20 4 20">
        <animateTransform attributeName="transform" type="rotate" from="360 400 140" to="0 400 140" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="400" cy="140" r="138" stroke-opacity="0.9" stroke-width="3" stroke-dasharray="40 820">
        <animateTransform attributeName="transform" type="rotate" from="0 400 140" to="360 400 140" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- logo glow pulse -->
    <g filter="url(#glow)">
      <use href="#kali" transform="translate(310 50) scale(7.5)" fill="url(#g)">
        <animate attributeName="fill-opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- glitch layers -->
    <use href="#kali" transform="translate(310 50) scale(7.5)" fill="#ff00ff" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;-4 0;4 1;0 0;0 0;3 -1;-3 0;0 0" keyTimes="0;0.06;0.1;0.14;0.6;0.64;0.68;0.72" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0;0;0.7;0.7;0" keyTimes="0;0.06;0.1;0.14;0.6;0.64;0.68;0.72" dur="4s" repeatCount="indefinite"/>
    </use>
    <use href="#kali" transform="translate(310 50) scale(7.5)" fill="#00f0ff" opacity="0">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;4 0;-4 -1;0 0;0 0;-3 1;3 0;0 0" keyTimes="0;0.06;0.1;0.14;0.6;0.64;0.68;0.72" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0;0;0.6;0.6;0" keyTimes="0;0.06;0.1;0.14;0.6;0.64;0.68;0.72" dur="4s" repeatCount="indefinite"/>
    </use>

    <!-- scanning beam clipped to the logo -->
    <g clip-path="url(#logoClip)">
      <rect x="300" y="40" width="200" height="30" fill="url(#scan)">
        <animate attributeName="y" values="30;230;30" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="262" y="140" width="276" height="1.5" fill="#00f0ff" opacity="0.6">
      <animate attributeName="y" values="40;240;40" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <!-- title -->
    <text x="400" y="288" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="8" fill="#00f0ff" filter="url(#glow)">
      KALI LINUX
      <animate attributeName="fill-opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </text>

    <!-- typed prompt -->
    <g clip-path="url(#typeClip)">
      <text x="190" y="320" font-family="Fira Code, Consolas, monospace" font-size="15" fill="#39ff14" textLength="420" lengthAdjust="spacingAndGlyphs">root@kali:~# ./valhala022-dev --scan --stealth</text>
    </g>
    <rect x="190" y="306" width="9" height="16" fill="#39ff14">
      <animate attributeName="x" values="190;610;610;190" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- frame -->
    <rect x="1.5" y="1.5" width="797" height="337" rx="15" fill="none" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="2"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
